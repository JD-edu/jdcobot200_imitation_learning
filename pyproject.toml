[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jdcobot200"
version = "0.2.0"
description = "Hardware, configuration, and robot-description utilities for JDCobot200"
requires-python = ">=3.9"
dependencies = [
  "pyserial>=3.5",
  "PyYAML>=6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["jdcobot200*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
